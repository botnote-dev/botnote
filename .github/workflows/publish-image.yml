name: Publish image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy:
        description: Call the deploy webhook after the build (redeploys whatever tag the host tracks)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A manual run from a branch publishes only a `sha-` tag, so it can never
      # move `latest` or overwrite a released version.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/botnote-dev/botnote-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.ref_type != 'tag' }}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=botnote-server
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: redeploy a host that pulls this image (Coolify and similar
      # expose a deploy webhook). Skipped unless both secrets are set.
      - name: Trigger deploy
        if: github.ref_type == 'tag' || inputs.deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_TOKEN" ]; then
            echo "no deploy webhook configured; skipping"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" "$DEPLOY_WEBHOOK_URL"
